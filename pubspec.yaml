name: caldav
description: >-
  CalDAV, CardDAV, and WebDAV client for Dart/Flutter. Calendar and contact CRUD,
  free/busy, RFC 6578 collection sync, dual discovery (DavSession), and sync-token caching.
version: 2.2.0
homepage: https://github.com/ssyuk/caldav

environment:
  sdk: ^3.10.4

dependencies:
  dio: ^5.11.0
  xml: ^7.0.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
