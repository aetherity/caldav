version: 1.5.0
homepage: https://github.com/ssyuk/caldav

environment:
  sdk: ^3.10.4

dependencies:
  dio: ^5.11.0
  xml: ^7.0.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
